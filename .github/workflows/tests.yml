name: Tests

on:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read


jobs:
  tests:
    name: Pest (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # composer.json requires ^8.4; add further versions here when supported.
        php: ['8.4']
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          # No coverage driver in CI: the tracked phpunit.xml.dist requests an
          # HTML *path* coverage report that needs Xdebug and takes minutes.
          # Tests below always run with --no-coverage.
          coverage: none

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache composer packages
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-php-${{ matrix.php }}-${{ hashFiles('composer.json') }}
          restore-keys: |
            composer-${{ runner.os }}-php-${{ matrix.php }}-

      - name: Validate composer files
        run: composer validate

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Generate locales
        run: |
          sudo locale-gen it_IT.UTF-8 de_DE.UTF-8 fr_FR.UTF-8 en_US.UTF-8 ru_RU.UTF-8 zh_CN.UTF-8
          sudo update-locale

      - name: Run Pest
        # tests/bootstrap.php regenerates tests/data.php / tests/data.json via
        # bin/export-plural-rules on every run; the checkout is writable, so no
        # extra setup is required.
        run: vendor/bin/pest --no-coverage
